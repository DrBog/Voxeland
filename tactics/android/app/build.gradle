plugins { id 'com.android.application' }

android {
    namespace 'com.voxeland.ironwake'
    compileSdk 34

    defaultConfig {
        applicationId "com.voxeland.ironwake"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // serves the bundled page from a real https origin instead of file://,
    // which is what keeps localStorage — and therefore the campaign save —
    // working the way it does in a browser
    implementation 'androidx.webkit:webkit:1.11.0'
}
